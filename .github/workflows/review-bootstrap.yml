name: Review implementation bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/review-bootstrap.yml'

permissions:
  contents: read

jobs:
  browser:
    if: github.head_ref == 'feat/review-delivery-roster-20260927' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Temporary browser-only tooling for the isolated local acceptance runner.
      # No checkout, project data, credentials or repository archive is involved.
      - run: pip install playwright==1.57.0
      - run: python -m playwright install chromium
      - run: tar -C "$HOME/.cache" -czf /tmp/review-browser.tar.gz ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: review-browser
          path: /tmp/review-browser.tar.gz
          retention-days: 1
