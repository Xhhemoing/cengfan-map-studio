name: Review continuation source
on:
  pull_request:
    paths:
      - '.github/workflows/review-continue-bootstrap.yml'
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'feat/review-delivery-roster-20260927' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=/tmp/review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-continuation-source
          path: /tmp/review-source.tar.gz
          retention-days: 1
