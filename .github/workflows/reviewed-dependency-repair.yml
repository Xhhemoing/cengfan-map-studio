# Temporary, reviewed repair runner. Remove after its single-purpose commit.
name: Reviewed dependency repair
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/open-source-readiness-20260930'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # npm/cli#9787: npm 10 Arborist crashes in optional peer-set resolution.
      # Pin the repair tool only; normal npm ci still validates the final lockfile.
      - name: Generate reviewed dependency-chain repair without lifecycle scripts
        run: |
          npx --yes npm@11.19.0 install --package-lock-only --ignore-scripts --save-dev vitest@4.1.11 --registry=https://registry.npmjs.org
          npx --yes npm@11.19.0 update --package-lock-only --ignore-scripts undici brace-expansion --registry=https://registry.npmjs.org
          npm audit --package-lock-only --registry=https://registry.npmjs.org
      - name: Commit only dependency manifests to the named maintenance branch
        run: |
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): repair audited development dependency chains'
          git push origin HEAD:refs/heads/chore/open-source-readiness-20260930
