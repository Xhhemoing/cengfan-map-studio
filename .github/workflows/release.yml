name: Release

on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v (must have reviewed release notes)
        required: true
        type: string
        default: '0.1.3'
      expected_sha:
        description: Full main commit SHA reviewed for this release
        required: true
        type: string
      cleanup_merged:
        description: Delete only merged branches whose tips have not moved
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve explicit release request
        env:
          MANUAL_CLEANUP: ${{ inputs.cleanup_merged }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { validateVersion } from "./scripts/release-metadata.mjs";
          const { GITHUB_EVENT_NAME, GITHUB_EVENT_PATH, GITHUB_SHA, GITHUB_ENV } = process.env;
          let version = process.env.VERSION;
          let expected = process.env.EXPECTED_SHA;
          let cleanup = process.env.MANUAL_CLEANUP === "true";
          if (GITHUB_EVENT_NAME === "push") {
            const event = JSON.parse(readFileSync(GITHUB_EVENT_PATH, "utf8"));
            const request = JSON.parse(readFileSync(".github/release-request.json", "utf8"));
            if (!/^[a-f0-9]{40}$/.test(request.reviewed_base_sha) || request.reviewed_base_sha !== event.before) {
              throw new Error("Release request must name the exact previous main commit");
            }
            const changed = execFileSync("git", ["diff", "--name-only", event.before, GITHUB_SHA], { encoding: "utf8" }).trim();
            if (changed !== ".github/release-request.json") throw new Error("Request push may only change .github/release-request.json");
            if (typeof request.cleanup_merged !== "boolean") throw new Error("cleanup_merged must be a boolean");
            version = request.version;
            expected = GITHUB_SHA;
            cleanup = request.cleanup_merged;
          } else if (GITHUB_EVENT_NAME !== "workflow_dispatch") {
            throw new Error("Unsupported release event");
          }
          validateVersion(version);
          if (!/^[a-f0-9]{40}$/.test(expected)) throw new Error("Expected a full commit SHA");
          appendFileSync(GITHUB_ENV, `VERSION=${version}\nEXPECTED_SHA=${expected}\nCLEANUP_MERGED=${cleanup}\n`);
          NODE
      - name: Validate reviewed main and unused tag
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { validateVersion } from "./scripts/release-metadata.mjs"; validateVersion(process.env.VERSION); if (!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_SHA)) throw new Error("Expected a full commit SHA");'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo 'Tag already exists. Never overwrite a published tag; see docs/RELEASING.md.' >&2
            exit 1
          fi
      - run: npm ci
      - name: Synchronize version without resolving dependencies
        run: |
          node scripts/prepare-release.mjs "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/lib/feedback-links.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$VERSION"
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run lint
      - name: Full regression suite
        run: npm test -- --reporter=default --reporter=json --outputFile=artifacts/tests/results.json
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full application production build
        run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/topbar-tools" --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          ln -s "$RUNNER_TEMP/topbar-tools/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/topbar-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Real application browser regression
        run: node scripts/check-topbar-browser.mjs
      - name: Build root-path static distribution
        run: npm run build
        env:
          BASE_PATH: /
          VITE_PUBLIC_DEMO: '1'
      - name: Package tested static distribution
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("dist/BUILD_INFO.json", JSON.stringify({version:process.env.VERSION,commit:process.env.RELEASE_SHA,mode:"static-public-demo",basePath:"/",source:`https://github.com/${process.env.GH_REPO}/tree/${process.env.RELEASE_SHA}`,workflow:`https://github.com/${process.env.GH_REPO}/actions/runs/${process.env.GITHUB_RUN_ID}`},null,2)+"\n");'
          cp dist/BUILD_INFO.json artifacts/release/BUILD_INFO.json
          tar -czf "artifacts/release/cengfan-map-studio-v$VERSION-web.tar.gz" -C dist .
          (cd dist && zip -qr "../artifacts/release/cengfan-map-studio-v$VERSION-web.zip" .)
          (cd artifacts/release && sha256sum *.tar.gz *.zip BUILD_INFO.json > SHA256SUMS.txt)
          git diff --exit-code
      - name: Publish only the exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
          gh auth setup-git
          git tag -a "v$VERSION" -m "Release v$VERSION" "$RELEASE_SHA"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
          gh release create "v$VERSION" artifacts/release/* --verify-tag --target "$RELEASE_SHA" --draft --title "v$VERSION - Open-source maintenance and reliable delivery" --notes-file "docs/releases/v$VERSION.md"
          gh release edit "v$VERSION" --draft=false --latest
          echo "Published v$VERSION at $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean only unchanged merged branches
        if: env.CLEANUP_MERGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git for-each-ref --merged="$RELEASE_SHA" --format='%(objectname) %(refname:strip=3)' refs/remotes/origin |
          while read -r sha branch; do
            case "$branch" in main|HEAD|gh-pages|'') continue ;; esac
            if git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"; then
              echo "Removed merged branch: $branch ($sha)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Kept $branch: changed or protected; no unconditional deletion attempted."
            fi
          done
      - name: Explicitly deploy Pages from the released tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f source_ref="v$VERSION"
      - name: Retain validation evidence and distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            artifacts/tests/results.json
            artifacts/topbar/
            artifacts/release/
          if-no-files-found: ignore
          retention-days: 14
